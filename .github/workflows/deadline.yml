name: FPL deadline
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_deadline.py
      - name: Commit if changed
        run: |
          git config user.name "deadline-bot"
          git config user.email "deadline-bot@users.noreply.github.com"
          git add data/deadline.json
          git diff --cached --quiet || git commit -m "data: next FPL deadline" && git push
